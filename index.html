<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b1d">
<meta name="description" content="Neon Dodge — a space arcade game.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">

<title>Neon Dodge 2.0</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b1d;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f4f7ff;touch-action:none}
button{font:inherit;font-weight:800;border:1px solid #35436f;border-radius:13px;background:#151d40;color:#f5f7ff;padding:12px 15px;min-height:46px;touch-action:manipulation}
button.primary{background:linear-gradient(135deg,#63f5ff,#9b7cff);color:#080b1d;border:0;box-shadow:0 5px 22px #5eeaff28}
button:disabled{opacity:.42}
#app{height:100dvh;max-width:720px;margin:auto;display:flex;flex-direction:column;padding:10px;gap:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 3px}
h1{font-size:clamp(19px,5vw,27px);letter-spacing:2px;color:#63f5ff;margin:0;text-shadow:0 0 15px #00d9ff66}
.stats{display:flex;gap:13px;text-align:right;color:#9eacd2;font-size:10px;letter-spacing:.6px}.stats strong{display:block;color:white;font-size:17px}
#gamebox{position:relative;flex:1;min-height:0;border:1px solid #303c67;border-radius:17px;overflow:hidden;background:#0a102a}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:10px;right:10px;top:9px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-size:12px;font-weight:800;text-shadow:0 2px 5px #000}
.hudpill{background:#070b20bd;border:1px solid #52628d66;border-radius:999px;padding:5px 9px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#070a1de8;padding:16px;overflow:auto}
.panel{width:min(100%,380px);max-height:100%;overflow:auto}.panel h2{font-size:clamp(26px,7vw,36px);margin:0 0 5px;color:#63f5ff;letter-spacing:1px}.panel p{font-size:13px;line-height:1.45;color:#c0c9e6;margin:8px 0 15px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#controls{display:flex;align-items:center;gap:8px;padding-bottom:2px}
.move{flex:1;min-width:0;height:48px;font-size:20px;padding:8px 4px}.hint{display:none;flex:1;text-align:center;font-size:11px;color:#9ba8cd;line-height:1.4}
.small{font-size:12px!important;color:#9eacd2!important}
.menurow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #293355;text-align:left}
.skinrow{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.skin{width:46px;height:46px;min-height:46px;padding:0;border-radius:12px;font-size:22px}
.list{max-height:180px;overflow:auto;text-align:left;background:#0c1230;border:1px solid #2a365e;border-radius:12px;padding:8px 12px;margin:10px 0}
.listitem{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #263153;font-size:12px}
@media(min-width:600px){#app{padding:16px}#controls{padding-bottom:6px}}
</style>
</head>
<body>
<div id="app">
<header><h1>NEON DODGE <span style="font-size:10px;color:#a89aff">2.0</span></h1><div class="stats"><div>SCORE<strong id="score">0</strong></div><div>COINS<strong id="coins">0</strong></div><div>BEST<strong id="best">0</strong></div></div></header>
<div id="gamebox"><canvas id="game" aria-label="Neon Dodge 2D game"></canvas>
<div id="hud"><span class="hudpill" id="powerhud">⚡ No power-up</span><span class="hudpill" id="runcoins">🪙 0 this run</span></div>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
</div>
<div id="controls"><button class="move" id="left" aria-label="Move left">◀</button><button class="move" id="up" aria-label="Move up">▲</button><button class="move" id="down" aria-label="Move down">▼</button><button class="move" id="right" aria-label="Move right">▶</button><div class="hint">MOVE SHIP</div><button id="pause" style="font-size:12px;padding:8px 10px">PAUSE</button></div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),box=$('gamebox'),overlay=$('overlay'),panel=$('panel');
let W=360,H=600,dpr=1,player=null,obstacles=[],items=[],particles=[],running=false,paused=false,screen='menu',last=0,elapsed=0,spawn=0,itemSpawn=0,score=0,runCoins=0,moveDir=0,moveY=0,frame=0,shield=0,slow=0,flash=0,audioCtx=null;
const SKINS=[{name:'Cyan',color:'#63f5ff',cost:0},{name:'Pink',color:'#ff5ac8',cost:40},{name:'Gold',color:'#ffd166',cost:80},{name:'Lime',color:'#a6ff6b',cost:120},{name:'Violet',color:'#b69cff',cost:180}];
let data={coins:0,best:0,skin:0,unlocked:[0],scores:[],sound:true,difficulty:'normal',controlMode:'buttons'};
try{const d=JSON.parse(localStorage.getItem('neonDodge2')||'{}');data={...data,...d};if(!Array.isArray(data.unlocked))data.unlocked=[0];if(!Array.isArray(data.scores))data.scores=[]}catch(e){}
data.unlocked=[...new Set([0,...data.unlocked])];data.skin=Number(data.skin)||0;if(!['easy','normal','hard'].includes(data.difficulty))data.difficulty='normal';if(!['glide','buttons'].includes(data.controlMode))data.controlMode='buttons';
function save(){try{localStorage.setItem('neonDodge2',JSON.stringify(data))}catch(e){}}
function resize(){const r=box.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=Math.max(1,r.width);H=Math.max(1,r.height);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(player){player.y=Math.max(player.r+8,Math.min(H-player.r-8,player.y));player.x=Math.max(player.r+4,Math.min(W-player.r-4,player.x))}draw()}
addEventListener('resize',resize);
function sound(type){if(!data.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.connect(gain);gain.connect(audioCtx.destination);let f=type==='coin'?880:type==='power'?520:type==='hit'?110:type==='buy'?660:300;osc.frequency.setValueAtTime(f,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(Math.max(45,f*.55),audioCtx.currentTime+.12);gain.gain.setValueAtTime(.07,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.14);osc.start();osc.stop(audioCtx.currentTime+.15)}catch(e){}}
function menu(){screen='menu';running=false;paused=false;overlay.style.display='flex';$('pause').textContent='PAUSE';panel.innerHTML=`<h2>NEON DODGE</h2><p>Fly in every direction through a field of asteroids, spinning mines and comets. Grab coins and power-ups!</p><div class="menurow"><span>🪙 Wallet</span><strong>${data.coins}</strong></div><div class="menurow"><span>🏆 Best score</span><strong>${data.best}</strong></div><div class="menurow"><span>⚙️ Settings</span><strong>${difficultyName()} · ${controlName()}</strong></div><button class="primary" id="play" style="width:100%;margin-top:14px">▶ PLAY</button><div class="actions"><button id="settings">⚙️ Difficulty & Controls</button><button id="skins">🎨 Skins</button><button id="leader">🏆 Leaderboard</button><button id="soundbtn">${data.sound?'🔊 Sound on':'🔇 Sound off'}</button><button id="how">❔ How to play</button></div><p class="small">Collect 🪙 coins to unlock skins. 💠 shields protect you; ⚡ slows time.</p>`;$('play').onclick=start;$('settings').onclick=settingsScreen;$('skins').onclick=skinScreen;$('leader').onclick=leaderScreen;$('soundbtn').onclick=()=>{data.sound=!data.sound;save();sound('tap');menu()};$('how').onclick=howScreen}

function difficultyName(){return ({easy:'Easy',normal:'Normal',hard:'Hard'})[data.difficulty]||'Normal'}
function controlName(){return data.controlMode==='glide'?'Touch-glide':'Buttons'}
function settingsScreen(){screen='settings';panel.innerHTML=`<h2>GAME SETTINGS</h2><p>Choose how challenging the run feels and how you steer.</p><div class="menurow"><strong>DIFFICULTY</strong><span class="small">${difficultyName()}</span></div><div class="actions"><button data-diff="easy" class="${data.difficulty==='easy'?'primary':''}">🟢 Easy</button><button data-diff="normal" class="${data.difficulty==='normal'?'primary':''}">🟡 Normal</button><button data-diff="hard" class="${data.difficulty==='hard'?'primary':''}">🔴 Hard</button></div><p class="small" id="diffdesc">${difficultyDescription()}</p><div class="menurow"><strong>CONTROL MODE</strong><span class="small">${controlName()}</span></div><div class="actions"><button data-control="glide" class="${data.controlMode==='glide'?'primary':''}">☝ Touch-glide</button><button data-control="buttons" class="${data.controlMode==='buttons'?'primary':''}">◀ ▶ Buttons</button></div><p class="small">Touch-glide: drag anywhere in the playfield to steer in every direction. Buttons: hold the arrow buttons to move up, down, left or right.</p><button class="primary" id="settingsback" style="width:100%;margin-top:10px">SAVE & BACK</button>`;panel.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{data.difficulty=b.dataset.diff;save();settingsScreen()});panel.querySelectorAll('[data-control]').forEach(b=>b.onclick=()=>{data.controlMode=b.dataset.control;save();applyControlMode();settingsScreen()});$('settingsback').onclick=menu;applyControlMode()}
function difficultyDescription(){return ({easy:'Easy: much slower hazards with long gaps between them.',normal:'Normal: relaxed speed and plenty of room to react.',hard:'Hard: faster hazards and more frequent obstacles.'})[data.difficulty]||''}
function applyControlMode(){const show=data.controlMode==='buttons';$('left').style.display=show?'':'none';$('right').style.display=show?'':'none';$('controls').style.justifyContent=show?'':'center';['left','right','up','down'].forEach(id=>$(id).style.display=show?'':'none');document.querySelector('#controls .hint').style.display=show?'none':'block';document.querySelector('#controls').style.gap='5px';}

function howScreen(){screen='how';panel.innerHTML=`<h2>HOW TO PLAY</h2><p>Move up, down, left and right to avoid asteroids, spinning mines and comets. Collect coins for your wallet. Blue diamonds give you a shield; yellow lightning slows the hazards temporarily.</p><div class="list"><div class="listitem"><span>🪨 Asteroids</span><span>Rocky space debris</span></div><div class="listitem"><span>✴️ Spinning mines</span><span>Watch their movement</span></div><div class="listitem"><span>☄️ Comets</span><span>Quick, glowing hazards</span></div><div class="listitem"><span>💠 Shield</span><span>Absorbs one hit</span></div><div class="listitem"><span>⚡ Slow time</span><span>Slows hazards</span></div></div><button class="primary" id="back" style="width:100%">BACK TO MENU</button>`;$('back').onclick=menu}
function skinScreen(){screen='skins';let content=SKINS.map((s,i)=>`<button class="skin" data-skin="${i}" style="color:${s.color};border-color:${s.color}">${data.unlocked.includes(i)?'◆':'🔒'}</button>`).join('');panel.innerHTML=`<h2>PLAYER SKINS</h2><p>Wallet: 🪙 ${data.coins}</p><div class="skinrow">${content}</div><div id="skindetail" class="list"></div><button id="back" class="primary" style="width:100%">BACK TO MENU</button>`;const detail=i=>{const s=SKINS[i],owned=data.unlocked.includes(i),selected=data.skin===i;$('skindetail').innerHTML=`<div class="menurow"><span style="color:${s.color}">◆ ${s.name}</span><strong>${selected?'EQUIPPED':owned?'UNLOCKED':'🪙 '+s.cost}</strong></div><p class="small">${selected?'This skin is active.':owned?'Select this skin to equip it.':'Spend coins to unlock this skin.'}</p><button class="primary" id="skinact" style="width:100%" ${selected?'disabled':''}>${selected?'EQUIPPED':owned?'EQUIP':'UNLOCK'}</button>`;$('skinact').onclick=()=>{if(owned){data.skin=i;sound('buy')}else if(data.coins>=s.cost){data.coins-=s.cost;data.unlocked.push(i);data.skin=i;sound('buy')}else{sound('hit');$('skindetail').insertAdjacentHTML('beforeend','<p class="small">Not enough coins yet — play another round!</p>')}save();skinScreen();detail(i);updateStats()}};panel.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>detail(Number(b.dataset.skin)));detail(data.skin);$('back').onclick=menu}
function leaderScreen(){screen='leader';const rows=[...data.scores].sort((a,b)=>b.score-a.score).slice(0,10);panel.innerHTML=`<h2>LOCAL LEADERBOARD</h2><p>Top runs saved on this device</p><div class="list">${rows.length?rows.map((r,i)=>`<div class="listitem"><span>${i+1}. ${new Date(r.date).toLocaleDateString()}</span><strong>${r.score} pts · 🪙 ${r.coins}</strong></div>`).join(''):'<p class="small">No runs yet. Play a game to record your first score!</p>'}</div><button class="primary" id="back" style="width:100%">BACK TO MENU</button><p class="small">This is a device-local leaderboard, not an online global ranking.</p>`;$('back').onclick=menu}
function updateStats(){$('score').textContent=Math.floor(score);$('coins').textContent=data.coins;$('best').textContent=data.best;$('runcoins').textContent='🪙 '+runCoins+' this run';$('powerhud').textContent=shield>0?'💠 Shield '+Math.ceil(shield)+'s':slow>0?'⚡ Slow '+Math.ceil(slow)+'s':'⚡ No power-up'}
function start(){applyControlMode();score=0;runCoins=0;elapsed=0;spawn=.4;itemSpawn=2;obstacles=[];items=[];particles=[];shield=0;slow=0;flash=0;frame=0;player={x:W/2,y:H-65,r:13};running=true;paused=false;screen='game';overlay.style.display='none';$('pause').textContent='PAUSE';updateStats();last=performance.now();requestAnimationFrame(loop)}
function pauseToggle(){if(!running)return;paused=!paused;if(paused){overlay.style.display='flex';panel.innerHTML=`<h2>PAUSED</h2><p>Take a break. Your run is waiting.</p><button class="primary" id="resume" style="width:100%">RESUME</button><button id="quit" style="width:100%;margin-top:8px">QUIT TO MENU</button>`;$('resume').onclick=()=>{paused=false;overlay.style.display='none';last=performance.now();requestAnimationFrame(loop)};$('quit').onclick=menu;$('pause').textContent='RESUME'}else{overlay.style.display='none';$('pause').textContent='PAUSE';last=performance.now();requestAnimationFrame(loop)}}
$('pause').onclick=pauseToggle;
function gameOver(){running=false;sound('hit');if(score>data.best)data.best=Math.floor(score);data.scores.push({score:Math.floor(score),coins:runCoins,date:new Date().toISOString()});data.scores.sort((a,b)=>b.score-a.score);data.scores=data.scores.slice(0,30);save();updateStats();screen='over';overlay.style.display='flex';panel.innerHTML=`<h2>GAME OVER</h2><p>Score <strong>${Math.floor(score)}</strong> · Coins collected <strong>${runCoins}</strong><br>Best score <strong>${data.best}</strong></p><button class="primary" id="again" style="width:100%">↻ PLAY AGAIN</button><button id="home" style="width:100%;margin-top:8px">MAIN MENU</button>`;$('again').onclick=start;$('home').onclick=menu}
function bindMove(id,axis,d){const el=$(id);const set=on=>{if(axis==='x'){if(on)moveDir=d;else if(moveDir===d)moveDir=0}else{if(on)moveY=d;else if(moveY===d)moveY=0}};el.addEventListener('pointerdown',e=>{e.preventDefault();set(true);el.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>set(false)))}bindMove('left','x',-1);bindMove('right','x',1);bindMove('up','y',-1);bindMove('down','y',1);
let glidePointer=null;canvas.addEventListener('pointerdown',e=>{if(!running||paused||data.controlMode!=='glide')return;glidePointer=e.pointerId;canvas.setPointerCapture?.(e.pointerId);moveDir=0;moveY=0;steerGlide(e)});canvas.addEventListener('pointermove',e=>{if(data.controlMode==='glide'&&running&&!paused&&glidePointer===e.pointerId)steerGlide(e)});function steerGlide(e){const r=canvas.getBoundingClientRect();if(!player)return;player.x=Math.max(player.r+4,Math.min(W-player.r-4,e.clientX-r.left));player.y=Math.max(player.r+8,Math.min(H-player.r-8,e.clientY-r.top));moveDir=0;moveY=0}['pointerup','pointercancel','lostpointercapture'].forEach(ev=>canvas.addEventListener(ev,e=>{if(glidePointer===e.pointerId)glidePointer=null}));
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){moveDir=-1;e.preventDefault()}if(['ArrowRight','d','D'].includes(e.key)){moveDir=1;e.preventDefault()}if(['ArrowUp','w','W'].includes(e.key)){moveY=-1;e.preventDefault()}if(['ArrowDown','s','S'].includes(e.key)){moveY=1;e.preventDefault()}if(e.key===' '){e.preventDefault();pauseToggle()}});addEventListener('keyup',e=>{if(['ArrowLeft','a','A','ArrowRight','d','D'].includes(e.key))moveDir=0;if(['ArrowUp','w','W','ArrowDown','s','S'].includes(e.key))moveY=0});
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function spawnObstacle(){const roll=Math.random(),type=roll<.48?'asteroid':roll<.78?'mine':'comet',w=type==='comet'?17:type==='mine'?25:28+Math.random()*18,h=type==='comet'?34:type==='mine'?25:25+Math.random()*18,scale=({easy:.52,normal:.72,hard:1.02})[data.difficulty]||.72,base=({easy:88,normal:112,hard:145})[data.difficulty]||112;obstacles.push({type,x:8+Math.random()*(W-w-16),y:-h,w,h,v:(base+Math.min(score*.35,65))*scale*(type==='comet'?1.12:1)*(Math.random()*.22+.9),phase:Math.random()*6,angle:Math.random()*6,spin:(Math.random()-.5)*2.4,hue:type==='comet'?190:type==='mine'?48:24})}
function spawnItem(){const type=Math.random()<.52?'coin':Math.random()<.5?'shield':'slow';items.push({type,x:18+Math.random()*(W-36),y:-25,r:type==='coin'?9:11,v:125+Math.min(score,100),spin:Math.random()*6})}
function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*240,vy:(Math.random()-.5)*240,life:.5,color})}
function loop(now){if(!running||paused)return;const dt=Math.min((now-last)/1000,.035);last=now;frame+=dt;elapsed+=dt;score+=dt*10*(({easy:1,normal:1.05,hard:1.2})[data.difficulty]||1);spawn-=dt;itemSpawn-=dt;const factor=slow>0?.48:1;if(slow>0)slow=Math.max(0,slow-dt);if(shield>0)shield=Math.max(0,shield-dt);if(flash>0)flash-=dt;
if(spawn<=0){spawnObstacle();const spawnScale=({easy:1.9,normal:1.45,hard:1.05})[data.difficulty]||1.45;spawn=(Math.max(.72,1.35-score*.0005)+Math.random()*.5)*spawnScale}if(itemSpawn<=0){spawnItem();itemSpawn=2.8+Math.random()*2.6}
player.x+=moveDir*W*1.05*dt;player.y+=moveY*H*1.0*dt;player.x=Math.max(player.r+4,Math.min(W-player.r-4,player.x));player.y=Math.max(player.r+8,Math.min(H-player.r-8,player.y));
for(let i=obstacles.length-1;i>=0;i--){const b=obstacles[i];b.y+=b.v*dt*factor;if(b.type==='asteroid'){b.x+=Math.sin(elapsed*1.8+b.phase)*17*dt;b.angle+=b.spin*dt}else if(b.type==='mine'){b.x+=Math.sin(elapsed*2.5+b.phase)*28*dt;b.angle+=b.spin*dt}else if(b.type==='comet'){b.x+=Math.sin(elapsed*2.2+b.phase)*42*dt;b.angle+=dt*3}b.x=Math.max(0,Math.min(W-b.w,b.x));if(b.y>H+40){obstacles.splice(i,1);continue}const cx=Math.max(b.x,Math.min(player.x,b.x+b.w)),cy=Math.max(b.y,Math.min(player.y,b.y+b.h));if((player.x-cx)**2+(player.y-cy)**2<(player.r-6)**2){if(shield>0){shield=0;obstacles.splice(i,1);burst(player.x,player.y,'#63f5ff',20);sound('power');flash=.18;continue}else{burst(player.x,player.y,'#ff4d9d',24);draw();gameOver();return}}}
for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=it.v*dt*factor;it.spin+=dt*4;if(it.y>H+30){items.splice(i,1);continue}if(Math.hypot(player.x-it.x,player.y-it.y)<player.r+it.r){if(it.type==='coin'){data.coins++;runCoins++;score+=5;sound('coin');burst(it.x,it.y,'#ffd166',10)}else if(it.type==='shield'){shield=7;sound('power');burst(it.x,it.y,'#63f5ff',14)}else{slow=5;sound('power');burst(it.x,it.y,'#ffd166',14)}items.splice(i,1);save()}}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
updateStats();draw();requestAnimationFrame(loop)}
function draw(){if(!ctx)return;ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0c1433');g.addColorStop(1,'#080b1d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#5b77b7';ctx.globalAlpha=.12;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=(frame*18)%40-40;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.globalAlpha=1;
for(const b of obstacles){ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h/2);ctx.rotate(b.angle||0);ctx.shadowBlur=13;ctx.shadowColor=`hsl(${b.hue} 100% 60%)`;ctx.fillStyle=`hsl(${b.hue} 72% 48%)`;ctx.strokeStyle=`hsl(${b.hue} 100% 72%)`;ctx.lineWidth=2;if(b.type==='asteroid'){ctx.beginPath();ctx.moveTo(-b.w*.42,-b.h*.18);ctx.lineTo(-b.w*.23,-b.h*.48);ctx.lineTo(b.w*.12,-b.h*.42);ctx.lineTo(b.w*.48,-b.h*.12);ctx.lineTo(b.w*.34,b.h*.3);ctx.lineTo(0,b.h*.48);ctx.lineTo(-b.w*.42,b.h*.25);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#ffdfb455';ctx.fillRect(-b.w*.12,-b.h*.1,5,4)}else if(b.type==='mine'){ctx.beginPath();ctx.arc(0,0,Math.min(b.w,b.h)*.38,0,Math.PI*2);ctx.fill();ctx.stroke();for(let k=0;k<8;k++){ctx.rotate(Math.PI/4);ctx.fillStyle='#ffe9a5';ctx.fillRect(-2,-b.h*.48,4,7)}}else{ctx.fillStyle='#6df4ff';ctx.beginPath();ctx.moveTo(0,-b.h*.5);ctx.lineTo(b.w*.38,b.h*.18);ctx.lineTo(0,b.h*.5);ctx.lineTo(-b.w*.38,b.h*.18);ctx.closePath();ctx.fill();ctx.stroke();ctx.globalAlpha=.45;ctx.fillStyle='#5eeaff';ctx.beginPath();ctx.moveTo(-b.w*.22,b.h*.24);ctx.lineTo(0,b.h*.85);ctx.lineTo(b.w*.22,b.h*.24);ctx.closePath();ctx.fill()}ctx.restore()}
for(const it of items){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.spin);ctx.shadowBlur=15;ctx.shadowColor=it.type==='coin'?'#ffd166':it.type==='shield'?'#63f5ff':'#ffe66d';ctx.fillStyle=it.type==='coin'?'#ffd166':it.type==='shield'?'#63f5ff':'#ffe66d';if(it.type==='coin'){ctx.beginPath();ctx.arc(0,0,it.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9c5d12';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,1)}else{ctx.beginPath();if(it.type==='shield'){ctx.moveTo(0,-12);ctx.lineTo(10,-5);ctx.lineTo(8,7);ctx.lineTo(0,12);ctx.lineTo(-8,7);ctx.lineTo(-10,-5)}else{ctx.moveTo(3,-12);ctx.lineTo(-7,1);ctx.lineTo(-1,1);ctx.lineTo(-4,11);ctx.lineTo(8,-3);ctx.lineTo(2,-3)}ctx.closePath();ctx.fill()}ctx.restore()}
